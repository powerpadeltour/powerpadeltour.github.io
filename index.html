<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Power Padel Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Saira:ital,wght@0,500;0,600;1,800;1,900&display=swap">
<style>
/* Layout: one-column ranking ladder; tapping a row opens a full player sheet over it. Single dark black/gold look by choice. */
:root{
  --bg:#0b0a08; --surface:#15130f; --surface-2:#1d1a14; --line:#2e2a20;
  --fg:#f3efe4; --muted:#a39b86; --gold:#f4b921; --gold-soft:rgba(244,185,33,.14);
  --up:#46d17a; --down:#ff6b5e;
  --display:'Saira',system-ui,sans-serif; --cond:'Saira Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--cond);font-size:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
button{font:inherit;color:inherit}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--bg) 78%,transparent);padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:46px;width:auto}
.brand h1{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(26px,6vw,36px);line-height:1;letter-spacing:-.5px}
.brand h1 span{color:var(--gold)}
.brand p{color:var(--muted);font-size:14px;letter-spacing:2px;text-transform:uppercase;margin-top:3px}
.tools{display:flex;gap:10px;margin-top:12px;position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:15;background:var(--surface);border:1px solid var(--gold);border-radius:12px;padding:6px;max-height:min(60vh,420px);overflow:auto;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.sugg button{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;width:100%;background:none;border:0;border-radius:8px;padding:6px 8px;cursor:pointer;text-align:left}
.sugg button:hover,.sugg button:focus-visible{background:var(--surface-2);outline:none}
.sugg .av{width:36px;height:36px}
.sugg .sn{font-weight:800;text-transform:uppercase;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg .sr{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.sugg .none{color:var(--muted);padding:8px}
.tools input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--fg);font:600 17px var(--cond)}
.tools input:focus{outline:2px solid var(--gold);outline-offset:1px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:14px;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#111}
.tab:focus-visible,.row:focus-visible,.close:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin-block:14px 18px}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px 12px;text-align:center;cursor:pointer;min-width:0}
.pod.p1{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--surface) 70%);padding-top:20px}
.pod .av{width:64px;height:64px;margin:0 auto}
.pod.p1 .av{width:82px;height:82px}
.pod .r{font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;color:var(--gold);line-height:1;margin-top:6px}
.pod .n{font-weight:800;font-size:17px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .pt{color:var(--muted);font-size:14px}

.list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:40px 44px 1fr auto auto;align-items:center;gap:12px;background:var(--surface);border:1px solid transparent;border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--line);background:var(--surface-2)}
.row .rk{font-family:var(--display);font-style:italic;font-weight:900;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.row .rk.top{color:var(--gold)}
.row .nm{font-weight:800;font-size:18px;text-transform:uppercase;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pts{font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--surface-2);border:2px solid var(--gold);display:block}
.av.none{display:grid;place-items:center;font-weight:800;color:var(--gold);font-size:15px}
.mv{font-size:13px;font-weight:800;min-width:42px;text-align:center;border-radius:999px;padding:2px 6px}
.mv.up{color:var(--up);background:rgba(70,209,122,.12)}
.mv.down{color:var(--down);background:rgba(255,107,94,.12)}
.mv.same{color:var(--muted)}
.mv.new{color:#111;background:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:30px}

/* live event */
.tab.live{display:inline-flex;align-items:center;gap:7px}
.tab.live[hidden]{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--down);box-shadow:0 0 0 0 rgba(255,107,94,.6)}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 1.6s infinite}@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(255,107,94,0)}100%{box-shadow:0 0 0 0 rgba(255,107,94,0)}}}
.evhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-block:14px 6px}
.evhead h2{font-family:var(--display);font-style:italic;font-weight:900;font-size:26px}
.evhead h2 span{color:var(--gold)}
.evhead p{color:var(--muted);font-size:14px;letter-spacing:1px}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);font-size:14px;margin-bottom:12px}
.note.admin{border-color:var(--gold);color:var(--fg)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
@media (max-width:420px){.groups{grid-template-columns:1fr}}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.grp h3{background:var(--gold);color:#111;font-weight:900;letter-spacing:2px;font-size:17px;padding:6px 12px;display:flex;justify-content:space-between}
.grp h3 small{font-weight:700;letter-spacing:1px;font-size:13px}
.stand{width:100%;border-collapse:collapse;font-size:15px}
.stand th{color:var(--muted);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;padding:6px 6px 4px;text-align:center}
.stand th:first-child{text-align:left;padding-left:12px}
.stand td{padding:6px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:700}
.stand td.tm{text-align:left;padding-left:12px;min-width:0}
.stand tr.q1 td.pos{color:var(--gold)}
.pos{width:22px}
.nm2{display:block;font-weight:800;line-height:1.15;text-transform:uppercase;font-size:14px}
.nm2 a,.mt a{color:inherit;text-decoration:none;cursor:pointer}
.nm2 a:hover,.mt a:hover{color:var(--gold)}
.net.pos-n{color:var(--up)}.net.neg-n{color:var(--down)}
.mts{border-top:1px solid var(--line);padding:6px 10px 10px;display:flex;flex-direction:column;gap:6px}
.mt{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:13px;font-weight:700;text-transform:uppercase}
.mt .r{text-align:right}
.mt .w{color:var(--gold)}
.sc{display:flex;gap:4px;align-items:center;font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.sc .b{min-width:30px;text-align:center;background:var(--surface-2);border-radius:6px;padding:1px 4px}
.sc .b.pend{color:var(--muted)}
.sc input{width:40px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);text-align:center;font:600 17px var(--display);padding:2px}
.sc input:focus{outline:2px solid var(--gold)}
.sc button{background:var(--gold);color:#111;border:0;border-radius:6px;font-weight:800;font-size:12px;padding:5px 7px;cursor:pointer}
.sc button[disabled]{opacity:.4;cursor:default}

/* countdown */
.cd{background:linear-gradient(120deg,var(--gold-soft),transparent 70%),var(--surface);border:1px solid var(--gold);border-radius:16px;padding:14px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
.cd .lb{font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:14px;color:var(--muted)}
.cd .lb b{display:block;color:var(--fg);font-size:18px;letter-spacing:1px}
.cd .clk{display:flex;gap:8px}
.cd .u{min-width:62px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 4px}
.cd .u b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-size:30px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.cd .u span{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.cd.live .clk{font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;color:var(--down)}

/* schedule */
.slot{display:grid;grid-template-columns:78px 1fr;gap:10px;margin-bottom:10px}
.slot .tt{font-family:var(--display);font-style:italic;font-weight:900;font-size:22px;color:var(--gold);line-height:1.1;padding-top:6px}
.slot .tt small{display:block;font:700 12px var(--cond);color:var(--muted);letter-spacing:2px;font-style:normal}
.slot .ms{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;min-width:0}
.sm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.sm .hd{display:flex;justify-content:space-between;font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.sm .hd b{color:var(--gold)}
.sm .done{color:var(--up)}
.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px}
.posters img{width:100%;border-radius:10px;border:1px solid var(--line);cursor:pointer;display:block}
.posters button{background:none;border:0;padding:0}

/* knockout */
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.subtab{flex:none;background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:700 13px var(--cond);letter-spacing:1px;text-transform:uppercase;color:var(--muted);cursor:pointer}
.subtab[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.round{margin-bottom:18px}
.round h3{font-family:var(--display);font-style:italic;font-weight:900;font-size:20px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.round h3 small{font:600 13px var(--cond);letter-spacing:1px;color:var(--muted);font-style:normal}
.kos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
@media (max-width:420px){.kos{grid-template-columns:1fr}}
.ko{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ko .lbl{font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between}
.side{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-weight:800;text-transform:uppercase;font-size:14px;min-width:0}
.side .tn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.side .tn.ph{color:var(--muted);font-weight:600;text-transform:none}
.side.w .tn{color:var(--gold)}
.side .g{font-family:var(--display);font-weight:600;font-size:18px;min-width:26px;text-align:center;background:var(--surface-2);border-radius:6px;font-variant-numeric:tabular-nums}
.ko select{width:100%;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;font:700 13px var(--cond);padding:4px}
.ko .adm{display:grid;grid-template-columns:1fr 44px;gap:6px;align-items:center}
.ko .adm .fix{font-weight:800;text-transform:uppercase;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ko .adm .fix.ph{color:var(--muted);text-transform:none;font-weight:600}
.ko .adm input{width:44px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);text-align:center;font:600 17px var(--display);padding:2px}
.ko .save{align-self:flex-end;background:var(--gold);color:#111;border:0;border-radius:6px;font-weight:800;font-size:12px;padding:5px 10px;cursor:pointer}
.champ{background:linear-gradient(90deg,var(--gold-soft),transparent);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:800;text-transform:uppercase}
.champ b{color:var(--gold);font-family:var(--display);font-style:italic;font-size:22px;display:block}

/* share */
.shr{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;color:var(--fg);font:700 13px var(--cond);letter-spacing:1px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex:none}
.shr:hover{border-color:var(--gold);color:var(--gold)}
.shr svg{width:14px;height:14px}
.grp h3 .shr{background:rgba(0,0,0,.15);border-color:rgba(0,0,0,.25);color:#111;padding:2px 9px;font-size:12px}
.mshr{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 4px;font-size:13px;grid-column:1/-1;justify-self:center;margin-top:-4px}
.mshr:hover{color:var(--gold)}
.hero{display:block;width:100%;max-width:420px;border-radius:12px;border:1px solid var(--line);margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#111;font-weight:800;padding:10px 16px;border-radius:999px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.flash{outline:2px solid var(--gold);outline-offset:3px}

/* tournaments tab */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.tcard h3{font-family:var(--display);font-style:italic;font-weight:900;font-size:24px}
.tcard h3 span{color:var(--gold)}
.tcard .meta{color:var(--muted);font-size:14px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.stage{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);align-items:baseline}
.stage b{min-width:94px;color:var(--gold);font-size:14px;letter-spacing:1px;text-transform:uppercase}
.stage div{min-width:0;font-weight:600}
.chip{display:inline-block;cursor:pointer;margin:0 6px 4px 0;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:15px}
.chip:hover{border-color:var(--gold)}

/* player sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-end}
.panel{background:var(--bg);width:100%;max-width:760px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px))}
@media (min-width:800px){.sheet{align-items:center}.panel{border-radius:18px;border-bottom:1px solid var(--line);max-height:92%}}
.ph{display:flex;gap:16px;align-items:center}
.ph .av{width:96px;height:96px;border-width:3px;flex:none}
.ph .av.none{font-size:30px}
.ph h2{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(28px,7vw,40px);line-height:1;text-transform:uppercase;text-wrap:balance}
.ph .sub{color:var(--muted);font-size:15px;letter-spacing:1px;margin-top:4px}
.close{margin-left:auto;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:18px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.kpi{background:var(--surface);border-radius:12px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi b.g{color:var(--gold)}
.kpi span{color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.sec{margin-top:20px}
.sec h4{font-size:14px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:100px 1fr 28px;gap:10px;align-items:center;font-weight:700;font-size:15px}
.bar .t{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .f{height:100%;background:var(--gold);border-radius:6px}
.bar .k{text-align:right;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th{color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums}
.tbl td.num{text-align:right}
.tbl tr.miss td{color:var(--muted);font-weight:500}
.st{display:inline-block;padding:1px 8px;border-radius:6px;font-weight:800;font-size:14px;background:var(--surface-2)}
.st.w{background:var(--gold);color:#111}
.st.f{color:var(--gold);border:1px solid var(--gold)}
.scroll{overflow-x:auto}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--cond);font-size:13px}
.legend{color:var(--muted);font-size:13px;margin-top:4px}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:28px;letter-spacing:1px}
@media (max-width:420px){.row{grid-template-columns:32px 40px 1fr auto;gap:10px}.row .mv{display:none}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style></head><body>

function chart(curve){

  for (let lv=1; lv<=6; lv++) s += `<line x1="${L}" x2="${W-R}" y1="${y(lv)}" y2="${y(lv)}" stroke="var(--line)"/><text x="${L-8}" y="${y(lv)+4}" text-anchor="end">${lv===6?"WIN":LV[lv].toUpperCase()}</text>`;
  let prevYear = null;

    if (yr !== prevYear){ if (prevYear){ const xm = (x(i)+x(i-1))/2; s += `<line x1="${xm}" x2="${xm}" y1="${T}" y2="${H-B+4}" stroke="var(--gold)" stroke-opacity=".4" stroke-dasharray="3 4"/>`; }
      s += `<text x="${x(i)}" y="${H-6}" text-anchor="middle" style="fill:var(--gold);font-weight:700">${yr}</text>`; prevYear = yr; }
    else s += `<text x="${x(i)}" y="${H-B+18}" text-anchor="middle">${id}</text>`; });

    if (cb === "W") s += `<text x="${x(i)}" y="${y(lv)-10}" text-anchor="middle" style="fill:var(--gold)">⚡</text>`;
  });
  return s + `</svg>`;
}

  if (!t) { sg.hidden = true; sg.innerHTML = ""; return; }
  const hits = P.filter(p => p.name.toLowerCase().includes(t)).slice(0, 12);
  sg.innerHTML = hits.length ? hits.map(p => `<button type="button" data-pick="${p.id}" role="option">${av(p)}<span class="sn">${esc(p.name)}</span><span class="sr">#${p.rank} · ${p.pts} pts</span></button>`).join("")
                             : `<div class="none">No player matches “${esc(qEl.value.trim())}”.</div>`;
  sg.hidden = false;
}
qEl.addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); suggest(); if (tab === "rank") render(); });
qEl.addEventListener("focus", suggest);
qEl.addEventListener("keydown", e => { if (e.key === "Enter") { const f = sg.querySelector("[data-pick]"); if (f) f.click(); } if (e.key === "ArrowDown") { const f = sg.querySelector("[data-pick]"); if (f) { e.preventDefault(); f.focus(); } } });
sg.addEventListener("click", e => { const b = e.target.closest("[data-pick]"); if (!b) return; e.stopPropagation(); sg.hidden = true; openPlayer(+b.dataset.pick); });
document.addEventListener("click", e => { if (!e.target.closest(".tools")) sg.hidden = true; });
document.getElementById("tab-rank").onclick = () => { tab = "rank"; render(); };
document.getElementById("tab-tour").onclick = () => { tab = "tour"; render(); };
document.getElementById("tab-live").onclick = () => { tab = "live"; render(); };
render();
startLive();
function openFromHash(){
  const h = location.hash.slice(1);
  let m;
  if ((m = /^p-([a-z0-9-]+)$/.exec(h)) && bySlug[m[1]]) openPlayer(bySlug[m[1]].id);
  else if ((m = /^p(\d+)$/.exec(h)) && byId[m[1]]) openPlayer(+m[1]);
  else if ((m = /^g-([A-H])$/.exec(h)) && EV) { tab = "live"; sub = "groups"; render(); const el = document.getElementById("g-" + m[1]); if (el) { el.scrollIntoView({block: "start"}); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 2000); } }
}
openFromHash();
</script>
